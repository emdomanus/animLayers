name = "emdomanus/anim_layers"
version = "0.1.0"
description = "Roblox animation clips on named layers of one Animator."
license = "MIT"
authors = ["emdomanus"]
repository = "https://github.com/emdomanus/animLayers"
private = true
includes = ["pesde.toml", "LICENSE", "README.md", "CHANGELOG.md", "src/**/*.luau"]

[target]
environment = "roblox"
lib = "src/shared.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[dependencies]
luauUtils = { repo = "emdomanus/luauUtils", rev = "51f60518efde736b5497c0cbd2121c0ea4c517f7" }
